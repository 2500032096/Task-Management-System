<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <div class="auth-tabs">
            <button id="tab-login" class="active" onclick="switchTab('login')">Login</button>
            <button id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <h2>Welcome Back</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn primary-btn">Log In</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="auth-form hidden">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" required placeholder="Nishith Challa">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn primary-btn">Sign Up</button>
        </form>
    </div>

    <script src="auth.js"></script>
</body>

</html>
