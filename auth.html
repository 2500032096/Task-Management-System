<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - User & Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2639 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .brand svg {
            width: 28px;
            height: 28px;
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 22px;
        }

        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .role-tab {
            border: none;
            background: transparent;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-tab.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
        }

        .mode-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #334155;
        }

        .mode-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .mode-btn:hover {
            background: #1d4ed8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            height: 42px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            color: #0f172a;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 42px;
        }

        .eye-toggle-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .eye-toggle-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .eye-toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }

        .success-msg {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M9 11l3 3L22 4" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <h1>TaskFlow</h1>
        </div>
        <p class="subtitle" id="auth-subtitle">Step 1: Register User Account before Login</p>

        <!-- Role Selector -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" data-role="user">User</button>
            <button type="button" class="role-tab" data-role="admin">Admin</button>
        </div>

        <!-- Register / Login Switch for Users -->
        <div class="mode-bar" id="user-mode-bar">
            <span id="mode-status-text">Already registered a user?</span>
            <button type="button" class="mode-btn" id="switch-mode-btn">User Login</button>
        </div>

        <div class="error-msg" id="error-box"></div>
        <div class="success-msg" id="success-box"></div>

        <form id="auth-form">
            <!-- Username field (shown during User Registration) -->
            <div class="form-group" id="username-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="e.g., vishnu" />
            </div>

            <!-- Email field (always shown for both User and Admin) -->
            <div class="form-group" id="email-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required />
                    <button type="button" class="eye-toggle-btn" id="toggle-password-btn" aria-label="Show password"
                        title="Show password">
                        <!-- Eye icon (show) -->
                        <svg id="eye-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <!-- Eye-off icon (hide) -->
                        <svg id="eye-closed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="display:none;">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.86 21.86 0 0 1 5.06-5.94"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 5c7 0 11 7 11 7a21.85 21.85 0 0 1-2.16 3.19"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Register User</button>
        </form>
    </div>

    <script src="auth.js"></script>
</body>

</html>
